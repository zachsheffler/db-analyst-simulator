server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SQLite runs in WebAssembly; make sure the binary is served with the right type.
    types {
        application/wasm wasm;
    }
    include /etc/nginx/mime.types;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets can be cached for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Content packs change between deploys; always revalidate.
    location /packs/ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
